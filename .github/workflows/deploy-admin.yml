# Deploy super-admin over SSH.
#
# Run: Actions → "Deploy admin" → choose branch + environment → Run workflow.
#
# Nginx serves the Vite `dist/` folder directly — no PM2 / Node for the admin UI.
#
# Create GitHub Environments named exactly: production  and  staging
# (Settings → Environments). Put SSH secrets on EACH environment.
#
# Required per environment:
#   SSH_HOST          server IP or hostname
#   SSH_USER          SSH username
#   SSH_PASSWORD      SSH login password
#
# Optional per environment (defaults below if omitted):
#   APP_DIR                  production: /var/www/html/mejoric/admin/MejoricAdmin
#                            staging:    /var/www/html/mejoric/admin-dev/MejoricAdmin
#   VITE_BASE                both: /
#   VITE_API_BASE_URL        production/staging API URLs
#   VITE_SOCKET_SERVER_URL   production/staging socket URLs

name: Deploy admin

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to checkout and pull on the server"
        required: true
        default: "main"
        type: string
      environment:
        description: "GitHub Environment (SSH creds + env secrets)"
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

concurrency:
  group: deploy-admin-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.branch }} → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      BRANCH: ${{ inputs.branch }}
      DEPLOY_ENV: ${{ inputs.environment }}
      APP_DIR: ${{ secrets.APP_DIR }}
      VITE_BASE: ${{ secrets.VITE_BASE }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      VITE_SOCKET_SERVER_URL: ${{ secrets.VITE_SOCKET_SERVER_URL }}
    steps:
      - name: Deploy over SSH (${{ inputs.environment }})
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script_stop: true
          envs: BRANCH,DEPLOY_ENV,APP_DIR,VITE_BASE,VITE_API_BASE_URL,VITE_SOCKET_SERVER_URL
          script: |
            set -euo pipefail

            BRANCH="${BRANCH}"
            DEPLOY_ENV="${DEPLOY_ENV}"

            if [ "$DEPLOY_ENV" = "staging" ]; then
              APP_DIR="${APP_DIR:-/var/www/html/mejoric/admin-dev/MejoricAdmin}"
              VITE_BASE="${VITE_BASE:-/}"
              VITE_API_BASE_URL="${VITE_API_BASE_URL:-https://mejoric.com/staging-api/mateandmentors}"
              VITE_SOCKET_SERVER_URL="${VITE_SOCKET_SERVER_URL:-https://mejoric.com/staging-api}"
              ADMIN_URL="https://admin-dev.mejoric.com"
            else
              APP_DIR="${APP_DIR:-/var/www/html/mejoric/admin/MejoricAdmin}"
              VITE_BASE="${VITE_BASE:-/}"
              VITE_API_BASE_URL="${VITE_API_BASE_URL:-https://mejoric.com/mateandmentors}"
              VITE_SOCKET_SERVER_URL="${VITE_SOCKET_SERVER_URL:-https://mejoric.com}"
              ADMIN_URL="https://admin.mejoric.com"
            fi

            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi
            export PATH="/usr/local/bin:/usr/bin:$PATH"

            echo "==> Environment: $DEPLOY_ENV"
            echo "==> Branch:      $BRANCH"
            echo "==> App dir:     $APP_DIR"
            echo "==> Dist:        $APP_DIR/dist"
            echo "==> Vite base:   $VITE_BASE"
            echo "==> API:         $VITE_API_BASE_URL"
            echo "==> URL:         $ADMIN_URL"

            cd "$APP_DIR"

            git fetch origin "$BRANCH"
            if git show-ref --verify --quiet "refs/heads/$BRANCH"; then
              git checkout "$BRANCH"
            else
              git checkout -b "$BRANCH" --track "origin/$BRANCH"
            fi
            git pull origin "$BRANCH"

            echo "==> Installing dependencies"
            npm install

            echo "==> Building static files ($DEPLOY_ENV)"
            export VITE_BASE
            export VITE_API_BASE_URL
            export VITE_SOCKET_SERVER_URL
            export VITE_APP_ENV=production
            npm run build

            if [ ! -f dist/index.html ]; then
              echo "Build failed: dist/index.html not found"
              exit 1
            fi

            echo "==> Done. Nginx should serve $APP_DIR/dist at $ADMIN_URL"
