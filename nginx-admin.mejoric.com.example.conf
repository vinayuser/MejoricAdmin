server {
    if ($host = mejoric.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name mejoric.com;
    return 404; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.mejoric.com admin-dev.mejoric.com dev.mejoric.com;
    return 301 https://$host$request_uri;
}
