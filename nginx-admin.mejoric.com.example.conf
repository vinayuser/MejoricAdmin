server {
    server_name mejoric.com;

    location /mateandmentors/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /staging-api/ {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Old staging front → https://dev.mejoric.com
    location = /staging {
        return 301 https://dev.mejoric.com/;
    }
    location /staging/ {
        rewrite ^/staging/(.*)$ https://dev.mejoric.com/$1 permanent;
    }

    # Old admin URLs → dedicated subdomain
    location = /admin {
        return 301 https://admin.mejoric.com/;
    }
    location /admin/ {
        rewrite ^/admin/(.*)$ https://admin.mejoric.com/$1 permanent;
    }

    location = /staging-admin {
        return 301 https://admin-dev.mejoric.com/;
    }
    location /staging-admin/ {
        rewrite ^/staging-admin/(.*)$ https://admin-dev.mejoric.com/$1 permanent;
    }

    location /socket.io/ {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Production frontend — static build
    location ^~ /assets/ {
        root /var/www/html/mejoric/front/build;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        root /var/www/html/mejoric/front/build;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mejoric.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mejoric.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Staging frontend — https://dev.mejoric.com
